name: CI & Security Compliance Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test-and-compliance:
    name: Test & Data Privacy Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Privacy & Sanitizer Unit Tests (Ley 21.663 & GDPR)
        run: |
          python tests/test_sanitizer.py

  docker-build:
    name: Docker Build & Non-Root Verification
    runs-on: ubuntu-latest
    needs: test-and-compliance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ops-sentinel:latest
